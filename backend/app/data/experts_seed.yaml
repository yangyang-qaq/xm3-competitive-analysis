# 专家名册的语义内核（手写）。
#
# 这份文件只写**必须由人决定**的字段：这个人是谁、他关心什么、他凭什么
# 判断。头像配色、徽章底色、图标这类机械字段由 `scripts/gen_experts.py`
# 确定性生成，不进这里。
#
# 为什么要拆开写
# --------------
# 48 人 × 每人 9 个字段 = 400 多行。全手写会引入错别字、重复 id、
# 层级与分组漂移，而这三样都**不会报错**——它们只会让名册悄悄变得不对。
# 拆成"人写语义 + 机器生成机械"之后，这份文件只有 48×8 行，
# 可以一口气读完并逐条审；剩下的 400 行由生成器保证一致。
#
# id 布局是**锁定**的，不许改
# --------------------------
#   L3-001..003   决策层 3   调研总监 / 首席分析官 / 质检总监
#   L2-001..009   战略层 9
#   L1-001..024   执行层·行业 24
#   L1-025..036   执行层·职能 12
#
# id 一旦写进 `expert_stats` 表和历史报告，改它就是一次数据迁移。
# 所以新增只能**追加**：`L1-024` 之后才有 `L1-025`，中间不留空号，
# 也不复用已经退休的号。`tests/unit/test_experts.py` 守着这条。
#
# one_liner 的写法
# ----------------
# 每条都要求**说出立场或方法**，不是复述岗位。"熟悉新能源汽车行业"
# 是一句废话——它不告诉你这个人会怎么看证据。好的写法是
# "区分用户说的和用户做的，只采信后者"：它同时说明了方法和偏见，
# 而这两样都会体现在他给出的论点上。
#
# 上限 40 字。超了不是为了排版好看——`roster_digest()` 要把 48 人
# 压进一次调度调用的 prompt，每人的一行就是预算。

version: 1

