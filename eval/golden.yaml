# 黄金集
#
# 一组**固定**的调研需求，用来回答一个问题：改了代码之后，这套东西是变好了还是变坏了？
# 没有固定输入，"质量"就只能靠感觉说；有了它，每次改动都能跑同一批需求、比同一批数字。
#
# 三个用途
# --------
# 1. **录制 cassette**（`backend/scripts/record_cassettes.py`）：跑一次真的，之后
#    无限次离线回放。CI 里跑的是同一份 `run_pipeline`，只换了 provider 实现。
# 2. **确定性指标**：幻觉引用率、无证据立论率、交叉验证率、维度覆盖率、成本、
#    耗时——全部从报告 JSON 直接算，不花 LLM。
# 3. **LLM-as-judge**：引用忠实度、可用性 rubric（见 `eval/judges/`）。
#
# 每条为什么在这儿
# ----------------
# `note` 不是描述这条 query 是什么，而是**它在测什么**。一条不测任何东西的 query
# 只会稀释指标：它跑绿了不能说明任何事，跑红了也不知道该去看哪一块。
# 所以下面覆盖的是**证据形态的差异**（公开参数表 / 财报 / UGC 口碑 / 几乎没有公开信息），
# 而不是品牌知名度。
#
# 已知代价
# --------
# - 录制物是 JSONL，含抓回的网页正文，体量在**几 MB** 量级，且会随 query 增加线性增长。
#   这是为了让 CI 能离线跑完整条流水线付的代价，写在 `问题记录.md` 与 `docs/EVAL.md` 里。
# - key 由请求内容决定，所以**改一个字（prompt、query、temperature）就会全部 miss**。
#   这是刻意的：回放的价值是证明"这条确定的路径能跑通"，不是假装一切照旧。

version: 1
queries:
  # ---------- 维度高度重合：测区分度 ----------
  - name: notion-vs-obsidian
    query: 对比 Notion 与 Obsidian
    mode: quick
    tags: [知识管理, 海外产品]
    note: 两个都是笔记工具，维度几乎完全重合。测的是功能矩阵**会不会给出一片
          4 分的格子**——一份没有区分度的对比表在版式上是完美的，只有固定输入才看得出来。

  - name: figma-vs-sketch
    query: 对比 Figma 与 Sketch
    mode: quick
    tags: [设计工具, 海外产品]
    note: 格局已经翻转（Sketch 曾一边倒领先）。测的是**判断会不会依赖过期证据**——
          时效性权重就是为这种情况存在的。

  - name: taobao-vs-pinduoduo
    query: 对比 淘宝 与 拼多多
    mode: quick
    tags: [电商, 国内大厂]
    note: 报道量极大。测的是**证据去重与独立信源上限**：采到 200 条和采到 60 条
          （去掉同源转载后）哪个数才是真的。

  # ---------- 壁垒类论点：测有没有证据撑 ----------
  - name: weread-vs-zhangyue
    query: 对比 微信读书 与 掌阅
    mode: quick
    tags: [数字阅读, 版权壁垒]
    note: 两家的核心壁垒都是版权，而版权明细不公开。测的是**"壁垒"这类论点
          有没有被证据撑住**——它最容易写成一句没有引用也听着很对的话。

  # ---------- 时效性：测"证据太旧"的降级 ----------
  - name: cursor-vs-copilot
    query: 对比 Cursor 与 GitHub Copilot
    mode: quick
    tags: [AI 编程, 海外产品]
    note: 产品月月更新，去年写的评测今天已经不准。测的是时效性权重与
          "可用证据太旧"时**降级而不是照写**。

  # ---------- 定价形状不同：测定价维度能不能表达 ----------
  - name: feishu-vs-dingtalk
    query: 对比 飞书 与 钉钉
    mode: quick
    tags: [协同办公, 国内大厂]
    note: 免费额度差异大且经常改，计价口径是"按人/按版本"。测的是定价表
          **能不能表达两种不同的计价形状**，而不是硬塞进一个"月费"格子。

  - name: jianying-vs-fcp
    query: 对比 剪映专业版 与 Final Cut Pro
    mode: quick
    tags: [视频剪辑, 跨市场]
    note: 免费订阅 vs 一次性买断，且一个国内一个海外。测的是**跨计价模式的比较**
          （以及跨币种折算时会不会把 0 当成"没查到这个价"）。

  # ---------- 公开参数表：测规格类证据 ----------
  - name: dji-mini4-vs-autel-evo
    query: 对比 大疆 Mini 4 Pro 与 Autel EVO Lite+
    mode: quick
    tags: [无人机, 参数型产品]
    note: 参数高度可比、官方页公开。测的是**数据表格里的每个格子是否都锚定了证据**
          （铁律 1：表格里的数字也是论点）。

  - name: su7-vs-zeekr007
    query: 对比 小米SU7 与 极氪007
    mode: quick
    tags: [新能源汽车, 参数型产品]
    note: 上市时间接近、规格公开且常被横评。测的是规格类证据的**可信度评分**
          是否与官方页/媒体横评拉开差距。

  # ---------- 需要财报：测财务维度 ----------
  - name: youzan-vs-weimob
    query: 对比 有赞 与 微盟
    mode: quick
    tags: [SaaS, 港股上市]
    note: 都是港股上市公司，财报口径可比。测的是**财报类证据能否进入财务维度**，
          以及"营收下滑"这类结论有没有引用到具体数字。

  # ---------- UGC 口碑为主：测舆情 ----------
  - name: dewu-vs-shihuo
    query: 对比 得物 与 识货
    mode: quick
    tags: [潮流电商, UGC 为主]
    note: 公开报道少，主要证据是用户评价。测的是**舆情标注的混合比例披露**——
          哪几条是 LLM 标的、哪几条退回了规则，报告要说出来。

  - name: huaxizi-vs-wanmei
    query: 对比 花西子 与 完美日记
    mode: quick
    tags: [美妆, 舆情驱动]
    note: 两者都高度依赖营销声量，且都经历过舆情反转。测的是负面舆情
          **能不能被如实标出来**，而不是被平均数抹平。

  # ---------- 商业模式差异：测维度生成 ----------
  - name: sams-vs-hema
    query: 对比 山姆会员店 与 盒马
    mode: quick
    tags: [零售, 商业模式差异]
    note: 会员制 vs 非会员制。测的是**维度规划能不能长出"会员/复购"这类维度**，
          而不是永远那六个通用维度。

  - name: ctrip-vs-fliggy
    query: 对比 携程 与 飞猪
    mode: quick
    tags: [OTA, 平台模式]
    note: 自营 vs 平台、佣金结构不同。测的是渠道与商业模式维度的证据锚定。

  - name: nio-vs-li
    query: 对比 蔚来 与 理想
    mode: deep
    tags: [新能源汽车, 技术路线之争]
    note: 换电 vs 增程，是**路线之争**而不是参数之争。测的是 deep 档
          能不能把争议写成"双方各自的论据"，而不是和稀泥。

  - name: byd-han-vs-model3
    query: 对比 比亚迪汉 与 特斯拉 Model 3
    mode: deep
    tags: [新能源汽车, 跨市场]
    note: 同一价格带、两地市场。测的是**独立信源数与平台覆盖**——
          中文与英文报道会不会被算成同一批证据。

  # ---------- 最贵的那条路：expert 档 ----------
  - name: chatgpt-vs-claude
    query: 对比 ChatGPT 与 Claude
    mode: expert
    tags: [AI 大模型, 专家档]
    note: 唯一一条 expert 档。三档模式里如果有一档**从来没被回放过**，
          那一档就等于没有回归保护。expert 有 8 章、搜索 ≤160 次、抓取 ≤100 条、
          返工 ≤3 轮的预算，也是唯一一条会走到"预算耗尽之后还要不要返工"
          这条路径的用例。中英文报道都多，适合压预算而不是压证据量。

  # ---------- 信息稀薄：测"如实降级"而不是编 ----------
  - name: mihoyo-vs-netease-games
    query: 对比 米哈游 与 网易游戏
    mode: quick
    tags: [游戏, 信息稀薄]
    note: 米哈游非上市、几乎不发财报。测的是**缺证据时如实降级**
          （degraded 非空、该维度标成未覆盖），而不是拿行业均值把格子填满。

  - name: genki-vs-nongfu
    query: 对比 元气森林 与 农夫山泉
    mode: quick
    tags: [饮料, 新消费 vs 传统]
    note: 新消费品牌的"增长"类数据多为媒体转述。测的是这类论点的
          证据稀薄度会不会被**如实反映在覆盖率上**。

  # ---------- 合规与政策：测非市场维度 ----------
  - name: gaode-vs-baidumap
    query: 对比 高德地图 与 百度地图
    mode: quick
    tags: [地图, 合规敏感]
    note: 数据资质与合规是核心壁垒。测的是**政策/合规类维度**能不能被规划出来
          并找到可引用的公开依据。

  - name: shein-vs-temu
    query: 对比 SHEIN 与 Temu
    mode: quick
    tags: [跨境电商, 竞品边界模糊]
    note: 供应链高度重叠、模式接近。测的是**"竞品"边界**：采集会不会把
          两家互相引用的同一篇报道算成两条独立证据。

# ---------- 歧义用例 ----------
# 单独列出来，因为它走的是另一条路径（澄清阶段）。
ambiguity:
  - name: vague-coffee-market
    query: 帮我看看现在的咖啡市场
    mode: quick
    tags: [澄清, 故意含糊]
    note: 没说对比谁、没说看什么维度。测的是**澄清阶段会不会问出对比对象**，
          以及自动采纳推荐项之后任务仍然跑得完（CLI 的 auto_clarify 走这条路）。
