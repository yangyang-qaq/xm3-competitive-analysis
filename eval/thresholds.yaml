# 闸门阈值
#
# 这里写的是**契约**，不是快照。
#
# 区别很重要：「契约」是"不管哪条 query 都不许破的线"，破了一定是坏了；
# 「快照」是"上次跑出来是多少"。把快照写进闸门，等于把闸门变成
# "和上次一样吗"——那样它既抓不到慢慢变坏，又会在一次合理改动后
# 变成需要手动更新的噪音，然后被加上 `continue-for-now`。
#
# 所以每条都分两类：
#
#   机制背书的（必须严格）
#     例如幻觉引用率。coercer 会把报告里引用了但不存在的编号丢掉，
#     所以这个数**在结构上**就该是 0。它不是"我们跑得好"，是"这件事
#     不可能发生"——一旦非 0，说明那层机制坏了，不是模型今天状态不好。
#
#   质量判断的（留余量）
#     例如维度覆盖率。0.6 是"再低就不像一份可用的竞品分析"，
#     不是"我们上次跑到 1.0"。留余量是因为它确实会随输入变化
#     （证据稀薄的那几条本来就该低），闸门不该因为一条难得的
#     真实结果而红。
#
# 取值依据：库里 16 份真实报告的实测区间。机制类的四条实测全是 0；
# 质量类的下限取在实测最低值与"明显坏了"之间，而不是贴着实测最低值
# ——贴着写会让闸门在正常波动下变红，而它变红一次就会被调松一次，
# 最后什么都不剩。
#
# `why` 会在破线时被打印出来。写它的原因是：**看到红叉的人应该是
# 拿着报错信息去修，而不是回来读这个文件**。

version: 1

thresholds:
  # ---------- 机制背书：必须严格 ----------
  hallucinationRate:
    max: 0.0
    why: coercer 会丢掉不存在的引用编号，所以这个数在结构上只能是 0
  phantomCitations:
    max: 0
    why: 同上，非 0 说明有一个不存在的编号混进了正文
  unsupportedClaimRate:
    max: 0.0
    why: 铁律一——每条论点都必须挂到证据上，没挂上的会被降级而不是留下

  # ---------- 质量判断：留余量 ----------
  dimensionCoverage:
    min: 0.6
    why: 计划维度里至少六成要有证据锚定，否则这份对比是空架子
  dimensionsCovered:
    min: 3
    why: 少于三个维度就不构成一份对比分析
  evidences:
    min: 20
    why: 低于这个数说明采集出了问题（实测区间是 50–216）
  independentDomains:
    min: 3
    why: 等于 citations.MIN_INDEPENDENT_DOMAINS，铁律二的下限
  crossValidationRate:
    min: 0.05
    why: 实测最低 0.083；低于 0.05 说明交叉验证基本没发生
  claims:
    min: 1
    why: 一条论点都没有的报告不该被当成跑通了

  # ---------- 上界：花超了 / 坏得太多 ----------
  degradedRate:
    max: 0.5
    why: 超过一半证据是降级的（只拿到摘要），这份报告的依据太薄
  llmOptionalFailures:
    max: 3
    why: 可选调用成片失败说明某一段在系统性地挂，不是偶发
  # 成本上界只对 `--live` 有意义（mock 恒为 0）。写在这里是为了
  # "某次改动让调用数翻了三倍"能在花掉一笔钱之前就被看见。
  llmCalls:
    max: 40
    why: quick 档实测 13 次左右；到 40 说明有循环在重复调用
